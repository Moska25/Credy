<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ project_name }}{% endblock %} · {{ project_name }}</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/"><span class="brand-mark"></span>{{ project_name }}
    <span class="brand-sub">{{ project_tagline }}</span></a>
  <nav class="nav">
    {% for href, label in nav %}
    <a href="{{ href }}" class="{{ 'active' if active == href else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>
</div></header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer"><div class="footer-inner">
  <span>{{ project_name }}</span><span class="spacer"></span>
  <span>{{ footer_note }}</span>
</div></footer>
{% block scripts %}{% endblock %}
</body>
</html>
